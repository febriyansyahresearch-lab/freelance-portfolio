name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn scikit-learn joblib ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check . --ignore E501 || true

      - name: Run tests
        run: |
          python -m pytest cyber_ml/tests/ stock_ml/tests/ fraud_detection/tests/ siem_dashboard/tests/ vulnerability_scanner/tests/ phishing_detector/tests/ -v
